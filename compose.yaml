services:
  go-backend:
    profiles: ["go", "all"]
    image: "${GO_IMAGE_REPOSITORY}:${GO_IMAGE_TAG}"
    build:
      context: "${GO_SOURCE_DIR}"
      dockerfile: "${GO_DOCKERFILE}"
      args:
        GO_VERSION: "${GO_VERSION}"
        GO_BUILD_PACKAGE: "${GO_BUILD_PACKAGE}"
      labels:
        com.deployment-toolkit.managed: "true"
        com.deployment-toolkit.project: "${COMPOSE_PROJECT_NAME:-deployment-dev}"
        com.deployment-toolkit.service: "go-backend"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      PORT: "${GO_CONTAINER_PORT:-8080}"
    ports:
      - "${GO_HOST_PORT:-8081}:${GO_CONTAINER_PORT:-8080}"
    restart: "${GO_RESTART_POLICY:-unless-stopped}"
    mem_limit: "${GO_MEMORY_LIMIT:-256m}"
    cpus: "${GO_CPU_LIMIT:-0.50}"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    labels:
      com.deployment-toolkit.managed: "true"
      com.deployment-toolkit.project: "${COMPOSE_PROJECT_NAME:-deployment-dev}"
      com.deployment-toolkit.service: "go-backend"
    networks:
      - application

  react-frontend:
    profiles: ["react", "all"]
    image: "${REACT_IMAGE_REPOSITORY}:${REACT_IMAGE_TAG}"
    build:
      context: "${REACT_SOURCE_DIR}"
      dockerfile: "${REACT_DOCKERFILE}"
      args:
        NODE_VERSION: "${NODE_VERSION}"
        NODE_BUILD_MEMORY_MB: "${NODE_BUILD_MEMORY_MB:-768}"
      labels:
        com.deployment-toolkit.managed: "true"
        com.deployment-toolkit.project: "${COMPOSE_PROJECT_NAME:-deployment-dev}"
        com.deployment-toolkit.service: "react-frontend"
    ports:
      - "${REACT_HOST_PORT:-3000}:${REACT_CONTAINER_PORT:-80}"
    restart: "${REACT_RESTART_POLICY:-unless-stopped}"
    mem_limit: "${REACT_MEMORY_LIMIT:-256m}"
    cpus: "${REACT_CPU_LIMIT:-0.50}"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    labels:
      com.deployment-toolkit.managed: "true"
      com.deployment-toolkit.project: "${COMPOSE_PROJECT_NAME:-deployment-dev}"
      com.deployment-toolkit.service: "react-frontend"
    networks:
      - application

  ruby-service:
    profiles: ["ruby", "all"]
    image: "${RUBY_IMAGE_REPOSITORY}:${RUBY_IMAGE_TAG}"
    build:
      context: "${RUBY_SOURCE_DIR}"
      dockerfile: "${RUBY_DOCKERFILE}"
      args:
        RUBY_VERSION: "${RUBY_VERSION}"
      labels:
        com.deployment-toolkit.managed: "true"
        com.deployment-toolkit.project: "${COMPOSE_PROJECT_NAME:-deployment-dev}"
        com.deployment-toolkit.service: "ruby-service"
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      PORT: "${RUBY_CONTAINER_PORT:-9292}"
      RACK_ENV: production
    ports:
      - "${RUBY_HOST_PORT:-9292}:${RUBY_CONTAINER_PORT:-9292}"
    restart: "${RUBY_RESTART_POLICY:-unless-stopped}"
    mem_limit: "${RUBY_MEMORY_LIMIT:-256m}"
    cpus: "${RUBY_CPU_LIMIT:-0.50}"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    healthcheck:
      test:
        - CMD
        - ruby
        - -rnet/http
        - -ruri
        - -e
        - "response=Net::HTTP.get_response(URI('http://127.0.0.1:9292/health')); exit(response.is_a?(Net::HTTPSuccess) ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      com.deployment-toolkit.managed: "true"
      com.deployment-toolkit.project: "${COMPOSE_PROJECT_NAME:-deployment-dev}"
      com.deployment-toolkit.service: "ruby-service"
    networks:
      - application

networks:
  application:
    name: "${COMPOSE_PROJECT_NAME:-deployment-dev}-network"
